<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniForth Fast</title>
<style>
body{font-family:monospace;margin:16px;}
#console{border:1px solid #888;height:40vh;overflow-y:auto;padding:10px;white-space:pre-wrap;background:#f9f9f9;font-size:15px;}
#startup{margin:12px 0;padding:12px;border:1px solid #bbc;background:#f6f8fa;}
#startup-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
#startup button{padding:8px 12px;font-family:monospace;font-size:15px;}
#library-options{margin-top:10px;border:1px solid #ccd;padding:8px;}
#library-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin:8px 0;}
#library-summary,#loader-status{margin:8px 0 0;white-space:pre-wrap;}
#loader-status{min-height:1.2em;font-weight:bold;}
#bar{display:flex;gap:8px;margin-top:8px;}
#input{flex:1;padding:10px;font-family:monospace;font-size:16px;}
#btn{padding:10px 16px;font-family:monospace;font-size:16px;}
#stack,#primitives,#words{margin-top:8px;padding:8px 10px;font-size:14px;overflow-x:auto;white-space:nowrap;border:1px solid #bbc;}
#stack{background:#eef3f7;}
#primitives{background:#f7edf0;}
#words{background:#edf7ee;}
</style>
</head>
<body>
<h3>MiniForth</h3>
<div id="console"></div>
<section id="startup" aria-label="Arrencada del MiniForth">
<div id="startup-controls">
<button id="boot-btn" type="button">Carrega el bootstrap i obre el REPL</button>
<button id="load-libraries-btn" type="button" disabled>Carrega les biblioteques seleccionades</button>
</div>
<fieldset id="library-options">
<legend>Biblioteques Forth opcionals</legend>
<label><input id="select-all-libraries" type="checkbox"> Selecciona-les totes</label>
<div id="library-list">
<label><input id="lib-post-repl" type="checkbox"> create / does&gt;</label>
<label><input id="lib-basics" type="checkbox"> Paraules bàsiques</label>
<label><input id="lib-loop-indices" type="checkbox"> Comptadors i / j</label>
<label><input id="lib-tick" type="checkbox"> ' i [']</label>
<label><input id="lib-strings" type="checkbox"> Cadenes</label>
<label><input id="lib-words" type="checkbox"> words</label>
<label><input id="lib-tools" type="checkbox"> execute / defer / see</label>
</div>
<div id="library-summary" aria-live="polite"></div>
</fieldset>
<div id="loader-status" role="status" aria-live="polite">Mode manual: pots continuar introduint Forth com fins ara.</div>
</section>
<div id="bar">
<input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ex: 10 20 + .">
<button id="btn" type="button">Executa</button>
</div>
<div id="stack">Pila (0): [buida]</div>
<div id="primitives">Primitives: + nand drop 0= @ ! sp@ emit . key key? ms branch ?branch</div>
<div id="words">Paraules Creades: [cap]</div>

<script>
const MEMSIZE = 16384;
const mem = new Int32Array(MEMSIZE);
let sp = 0;

let keyBuffer = [];
let compiling = false;
let waitingName = false;
let currentWord = null;
let keyResolver = null;
let outBuffer = "";

const OP_LIT     = 0;
const OP_ADD     = 1;
const OP_NAND    = 2;
const OP_DROP    = 3;
const OP_ZEQ     = 4;
const OP_FETCH   = 5;
const OP_STORE   = 6;
const OP_SPFETCH = 7;
const OP_EMIT    = 8;
const OP_DOT     = 9;
const OP_KEY     = 10;
const OP_KEYQ    = 11;
const OP_MS      = 12;
const OP_BRANCH  = 13;
const OP_QBRANCH = 14;
const OP_CALL    = 15;

const PRIM_MAP = {
  "+": OP_ADD, "nand": OP_NAND, "drop": OP_DROP, "0=": OP_ZEQ,
  "@": OP_FETCH, "!": OP_STORE, "sp@": OP_SPFETCH, "emit": OP_EMIT,
  ".": OP_DOT, "key": OP_KEY, "key?": OP_KEYQ, "ms": OP_MS,
  "branch": OP_BRANCH, "?branch": OP_QBRANCH
};

let codeOp = [];
let codeVal = [];
let words = [];
let wordMap = new Map();

const con = document.getElementById("console");
const inp = document.getElementById("input");
const btn = document.getElementById("btn");
const stk = document.getElementById("stack");
const wrdList = document.getElementById("words");
const bootBtn = document.getElementById("boot-btn");
const loadLibrariesBtn = document.getElementById("load-libraries-btn");
const selectAllLibraries = document.getElementById("select-all-libraries");
const librarySummary = document.getElementById("library-summary");
const loaderStatus = document.getElementById("loader-status");

const LIBRARIES = [
  { id: "post-repl", file: "post-repl.fth", label: "create / does>", requires: [] },
  { id: "basics", file: "basics.fth", label: "Paraules bàsiques", requires: ["post-repl"] },
  { id: "loop-indices", file: "loop-indices.fth", label: "Comptadors i / j", requires: ["basics"] },
  { id: "tick", file: "tick.fth", label: "' i [']", requires: ["post-repl"] },
  { id: "strings", file: "strings.fth", label: "Cadenes", requires: ["post-repl"] },
  { id: "words", file: "words.fth", label: "words", requires: [] },
  { id: "tools", file: "tools.fth", label: "execute / defer / see", requires: ["post-repl", "tick", "strings"] },
];
const libraryInputs = new Map(
  LIBRARIES.map(library => [library.id, document.getElementById(`lib-${library.id}`)]),
);
const executionFrames = [];
const promptWaiters = new Set();
const loadedLibraries = new Set();

let keyWaitKind = null;
let replActive = false;
let replPromise = null;
let replMode = "manual";
let manualExecutionBusy = false;
let loaderBusy = false;
let loaderPoisoned = false;
let automaticSession = false;
let libraryLoadingEligible = false;
let captureManualBaselineAtPrompt = false;
let sessionTouched = false;
let managedBaseline = null;

function flushOut() {
  if (outBuffer.length > 0) {
    // HTML text does not render a bare CR like the Enter echo of a terminal.
    // Normalize only the displayed text, without changing EMIT or the VM.
    con.textContent += outBuffer.replace(/\r\n?/g, "\n");
    outBuffer = "";
    con.scrollTop = con.scrollHeight;
  }
}

function out(t) {
  outBuffer += t;
  if (t.indexOf("\n") !== -1) flushOut();
}

function prompt() {
  out(compiling ? "... " : "ok> ");
  flushOut();
}

function updateStack() {
  if (sp === 0) {
    stk.textContent = "Pila (0): [buida]";
    return;
  }
  let items = new Array(sp);
  for (let i = 0; i < sp; i++) items[i] = mem[i];
  stk.textContent = "Pila (" + sp + "): " + items.join(" ") + " <-top";
}

function updateWordsList() {
  if (words.length === 0) {
    wrdList.textContent = "Paraules Creades: [cap]";
    return;
  }
  wrdList.textContent = "Paraules Creades: " + words.map(w => w.name).join(" ");
}

function push(x) {
  if (sp >= MEMSIZE) throw "stack overflow";
  mem[sp++] = x | 0;
}

function pop() {
  if (sp <= 0) throw "stack underflow";
  return mem[--sp];
}

function compileToken(tok) {
  if (/^-?\d+$/.test(tok)) {
    return { op: OP_LIT, val: parseInt(tok, 10) | 0 };
  }
  if (PRIM_MAP[tok] !== undefined) {
    return { op: PRIM_MAP[tok], val: 0 };
  }
  if (currentWord && currentWord.name === tok) {
    return { op: OP_CALL, val: words.length };
  }
  let wIdx = wordMap.get(tok);
  if (wIdx !== undefined) {
    return { op: OP_CALL, val: wIdx };
  }
  throw "unknown word: " + tok;
}

async function runCompiled(start, end) {
  const frame = { start, end };
  executionFrames.push(frame);
  try {
    let ip = start;
    let a, b, addr, flag;

    while (ip < end) {
      let op = codeOp[ip];
      let val = codeVal[ip];
      ip++;

      switch (op) {
      case OP_LIT:
        if (sp >= MEMSIZE) throw "stack overflow";
        mem[sp++] = val;
        break;
      case OP_ADD:
        b = pop(); a = pop(); push(a + b);
        break;
      case OP_NAND:
        b = pop(); a = pop(); push(~(a & b));
        break;
      case OP_DROP:
        pop();
        break;
      case OP_ZEQ:
        a = pop(); push(a === 0 ? -1 : 0);
        break;
      case OP_FETCH:
        addr = pop();
        if (addr < 0 || addr >= MEMSIZE) throw "bad address";
        push(mem[addr]);
        break;
      case OP_STORE:
        addr = pop(); a = pop();
        if (addr < 0 || addr >= MEMSIZE) throw "bad address";
        mem[addr] = a;
        break;
      case OP_SPFETCH:
        push(sp - 1);
        break;
      case OP_EMIT:
        out(String.fromCharCode(pop() & 255));
        break;
      case OP_DOT:
        out(pop() + " ");
        break;
      case OP_KEY:
        flushOut();
        if (keyBuffer.length === 0 && inp.value.length === 0) {
          await new Promise(resolve => {
            keyResolver = resolve;
            keyWaitKind = isReplTokenReaderActive() ? "repl-token" : "program";
            notifyLoaderState();
          });
          keyResolver = null;
          keyWaitKind = null;
          notifyLoaderState();
        }
        if (keyBuffer.length > 0) {
          push(keyBuffer.shift());
        } else {
          let c = inp.value.charCodeAt(0);
          inp.value = inp.value.slice(1);
          push(c);
        }
        break;
      case OP_KEYQ:
        push((keyBuffer.length > 0 || inp.value.length > 0) ? -1 : 0);
        break;
      case OP_MS:
        flushOut();
        await new Promise(r => setTimeout(r, pop()));
        break;
      case OP_BRANCH:
        addr = pop();
        ip = start + addr;
        break;
      case OP_QBRANCH:
        addr = pop(); flag = pop();
        if (flag === 0) ip = start + addr;
        break;
      case OP_CALL:
        let w = words[val];
        await runCompiled(w.start, w.end);
        break;
      }
    }
  } finally {
    executionFrames.pop();
  }
}

function sameFrame(frame, word) {
  return Boolean(frame && word && frame.start === word.start && frame.end === word.end);
}

function isReplTokenReaderActive() {
  const repl = words[wordMap.get("repl")];
  const reader = words[wordMap.get("word")];
  if (!repl || !reader) return false;
  let replFrame = -1;
  for (let i = 0; i < executionFrames.length; i++) {
    if (sameFrame(executionFrames[i], repl)) replFrame = i;
  }
  return replFrame >= 0 && sameFrame(executionFrames[replFrame + 1], reader);
}

function isReplAtPrompt() {
  return replActive && keyResolver !== null && keyWaitKind === "repl-token" &&
    keyBuffer.length === 0 && inp.value.length === 0;
}

function notifyLoaderState() {
  if (captureManualBaselineAtPrompt && isReplAtPrompt()) {
    managedBaseline = { here: mem[1000], latest: mem[1004] };
    captureManualBaselineAtPrompt = false;
  }
  updateLoaderControls();
  for (const waiter of [...promptWaiters]) waiter();

  if (loaderBusy || !replActive) return;
  if (keyWaitKind === "program") {
    setLoaderStatus("El REPL està executant una paraula que espera KEY. Acaba-la abans de carregar biblioteques.");
  } else if (isReplAtPrompt() && replMode === "manual") {
    setLoaderStatus("REPL manual preparat. Pots carregar biblioteques; les seleccionades es poden tornar a definir.");
  }
}

function setLoaderStatus(message) {
  loaderStatus.textContent = message;
}

function selectedLibraryIds() {
  return LIBRARIES
    .filter(library => libraryInputs.get(library.id)?.checked)
    .map(library => library.id);
}

function resolveLibraryPlan(selectedIds, alreadyLoaded = new Set()) {
  const byId = new Map(LIBRARIES.map(library => [library.id, library]));
  const explicitlySelected = new Set(selectedIds);
  const result = [];
  const visiting = new Set();
  const visited = new Set();

  function visit(id) {
    const library = byId.get(id);
    if (!library) throw new Error(`Biblioteca desconeguda: ${id}`);
    if (visited.has(id) || (alreadyLoaded.has(id) && !explicitlySelected.has(id))) return;
    if (visiting.has(id)) throw new Error(`Dependència circular a ${library.file}`);
    visiting.add(id);
    for (const dependency of library.requires) visit(dependency);
    visiting.delete(id);
    visited.add(id);
    result.push(library);
  }

  for (const id of selectedIds) visit(id);
  return result;
}

function updateLibrarySummary() {
  const selected = selectedLibraryIds();
  if (!selected.length) {
    librarySummary.textContent = "No s'ha seleccionat cap biblioteca.";
    return;
  }
  const plan = resolveLibraryPlan(selected, loadedLibraries);
  const selectedSet = new Set(selected);
  const added = plan.filter(library => !selectedSet.has(library.id));
  const repeated = selected.filter(id => loadedLibraries.has(id));
  const parts = [];
  if (added.length) {
    parts.push("Dependències que s'afegiran: " + added.map(library => library.file).join(", ") + ".");
  } else {
    parts.push("No cal afegir dependències.");
  }
  if (repeated.length) {
    parts.push("Es tornaran a carregar: " + repeated
      .map(id => LIBRARIES.find(library => library.id === id).file).join(", ") +
      ". Redefinir consumeix memòria; les definicions anteriors poden conservar les versions antigues.");
  }
  librarySummary.textContent = parts.join(" ");
}

function dictionaryHasHeader(name) {
  let address = mem[1004];
  let remaining = MEMSIZE;
  while (address !== 0 && remaining-- > 0) {
    if (address < 2040 || address + 2 >= MEMSIZE) return true;
    const signedLength = mem[address + 1];
    const length = Math.abs(signedLength);
    if (length < 1 || address + 2 + length >= MEMSIZE) return true;
    if (length === name.length) {
      let matches = true;
      for (let i = 0; i < length; i++) {
        if (mem[address + 2 + i] !== name.charCodeAt(i)) {
          matches = false;
          break;
        }
      }
      if (matches) return true;
    }
    const previous = mem[address];
    if (previous !== 0 && (previous < 2040 || previous >= address)) return true;
    address = previous;
  }
  return address !== 0;
}

function hasKnownLibraryHeaders() {
  return [
    "cd-error", "sf-variable", "li-tag", "tk-error",
    "st-variable", "wd-name", "mt-var",
  ].some(dictionaryHasHeader);
}

function isLibraryLoadSafe() {
  return replActive && !loaderPoisoned && isReplAtPrompt() &&
    mem[1005] === 0 && mem[1012] === 0 && mem[1016] === 0 &&
    mem[1010] === 0 &&
    // WORD allocates one length cell before waiting; more cells mean a partial token.
    mem[1000] === mem[1445] + 1;
}

function updateLoaderControls() {
  const locked = loaderBusy;
  const candidatePlan = resolveLibraryPlan(selectedLibraryIds(), loadedLibraries);
  bootBtn.disabled = locked || replActive || manualExecutionBusy || keyResolver !== null || loaderPoisoned;
  loadLibrariesBtn.disabled = locked || !isLibraryLoadSafe() || candidatePlan.length === 0;
  selectAllLibraries.disabled = locked;
  for (const input of libraryInputs.values()) input.disabled = locked;
  inp.disabled = locked;
  btn.disabled = locked;
}

function waitForReplTokenWait(timeoutMs = 30000) {
  if (isReplAtPrompt()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    let finished = false;
    const finish = (error) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      promptWaiters.delete(check);
      if (error) reject(error);
      else resolve();
    };
    const check = () => {
      if (isReplAtPrompt()) {
        finish();
      } else if (!replActive) {
        finish(new Error("El REPL s'ha aturat abans de tornar al lector."));
      } else if (loaderPoisoned) {
        finish(new Error("La sessió ha quedat en un estat parcial."));
      }
    };
    const timer = setTimeout(
      () => finish(new Error("El REPL no ha tornat al punt d'entrada segur en 30 segons.")),
      timeoutMs,
    );
    promptWaiters.add(check);
    check();
  });
}

function releaseKeyWait() {
  const resume = keyResolver;
  if (!resume) return false;
  keyResolver = null;
  keyWaitKind = null;
  resume();
  notifyLoaderState();
  return true;
}

function normalizeSourceLines(source) {
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  if (lines.at(-1) === "") lines.pop();
  return lines;
}

function findReplError(output) {
  return output.split(/\r?\n/)
    .find(line => /^ERROR:\s/.test(line.trimStart()) || /^\?\s*$/.test(line.trim()));
}

async function feedReplLine(line, file, lineNumber) {
  if (!isReplAtPrompt()) {
    throw new Error("El REPL ja no és al punt segur d'entrada.");
  }
  const outputStart = con.textContent.length;
  keyBuffer.push(...Array.from(line + "\r", character => character.charCodeAt(0)));
  if (!releaseKeyWait()) {
    keyBuffer.length = 0;
    throw new Error("S'ha perdut l'espera del REPL abans de carregar la línia.");
  }
  await waitForReplTokenWait();
  flushOut();
  const errorLine = findReplError(con.textContent.slice(outputStart));
  if (errorLine || mem[1010] !== 0) {
    const detail = errorLine || "error Forth";
    throw new Error(detail);
  }
}

async function loadLibraryIntoRepl(library, source) {
  const lines = normalizeSourceLines(source);
  for (let i = 0; i < lines.length; i++) {
    setLoaderStatus(`Carregant ${library.file}, línia ${i + 1} de ${lines.length}…`);
    try {
      await feedReplLine(lines[i], library.file, i + 1);
    } catch (error) {
      throw new Error(`${library.file}, línia ${i + 1}: ${String(error).replace(/^Error:\s*/, "")}`);
    }
  }
  if (mem[1005] !== 0 || mem[1012] !== 0 || mem[1016] !== 0) {
    throw new Error(`${library.file}, línia ${lines.length}: ha quedat una definició o una compilació incompleta.`);
  }
  loadedLibraries.add(library.id);
  managedBaseline = { here: mem[1000], latest: mem[1004] };
  updateLibrarySummary();
}

async function fetchTextFile(filename) {
  let url;
  try {
    url = new URL(filename, document.baseURI).href;
  } catch {
    throw new Error(`${filename}: no s'ha pogut construir l'adreça del fitxer.`);
  }

  let response;
  try {
    response = await fetch(url, { cache: "no-cache" });
  } catch (error) {
    throw new Error(`${filename}: no s'ha pogut descarregar (${String(error)}).`);
  }
  if (!response.ok) {
    throw new Error(`${filename}: el servidor ha respost HTTP ${response.status}.`);
  }
  const source = await response.text();
  const contentType = response.headers?.get?.("content-type") || "";
  if (!source.trim()) throw new Error(`${filename}: el fitxer és buit.`);
  if (/text\/html/i.test(contentType) || /^\s*(?:<!doctype\s+html|<html[\s>])/i.test(source)) {
    throw new Error(`${filename}: el servidor ha retornat HTML en lloc de Forth.`);
  }
  return source;
}

async function fetchSources(filenames) {
  const entries = await Promise.all(filenames.map(async filename => [
    filename,
    await fetchTextFile(filename),
  ]));
  return new Map(entries);
}

function sessionHasData() {
  return sp !== 0 || mem.some(value => value !== 0) ||
    codeOp.length !== 0 || codeVal.length !== 0 || words.length !== 0 ||
    compiling || waitingName || currentWord !== null ||
    keyBuffer.length !== 0 || inp.value.length !== 0;
}

function resetEngineState() {
  mem.fill(0);
  sp = 0;
  keyBuffer = [];
  compiling = false;
  waitingName = false;
  currentWord = null;
  keyResolver = null;
  keyWaitKind = null;
  codeOp = [];
  codeVal = [];
  words = [];
  wordMap = new Map();
  executionFrames.length = 0;
  inp.value = "";
  outBuffer = "";
  loadedLibraries.clear();
  replActive = false;
  replPromise = null;
  replMode = "manual";
  automaticSession = false;
  libraryLoadingEligible = false;
  captureManualBaselineAtPrompt = false;
  sessionTouched = false;
  managedBaseline = null;
  updateStack();
  updateWordsList();
}

function observeRepl(promise, mode) {
  if (replActive) throw new Error("Ja hi ha una instància del REPL activa.");
  replActive = true;
  replPromise = promise;
  replMode = mode;
  if (!loaderBusy) {
    setLoaderStatus(mode === "manual-safe"
      ? "REPL manual preparat. No s'han detectat biblioteques carregades; ara en pots afegir."
      : mode === "manual"
        ? "REPL manual preparat. Pots carregar biblioteques; les seleccionades es poden tornar a definir."
      : "REPL engegant…");
  }
  notifyLoaderState();
  promise.then(
    () => finishRepl(null),
    error => finishRepl(error),
  );
}

function finishRepl(error) {
  replActive = false;
  replPromise = null;
  keyWaitKind = null;
  if (error) {
    loaderPoisoned = true;
    setLoaderStatus(`El REPL s'ha aturat amb un error: ${String(error)}`);
  } else {
    setLoaderStatus("REPL aturat. Pots escriure repl per tornar-hi.");
  }
  notifyLoaderState();
}

function launchRepl(mode) {
  if (replActive) throw new Error("El REPL ja està actiu.");
  const repl = words[wordMap.get("repl")];
  if (!repl) throw new Error("No s'ha trobat la paraula repl del bootstrap.");
  if (mode === "manual") {
    const cleanBootstrap = mem[1000] >= 2040 && mem[1004] > 0 &&
      mem[1005] === 0 && mem[1012] === 0 && mem[1016] === 0 &&
      !sessionTouched && !hasKnownLibraryHeaders();
    if (cleanBootstrap) {
      mode = "manual-safe";
      libraryLoadingEligible = true;
      captureManualBaselineAtPrompt = true;
      loadedLibraries.clear();
      managedBaseline = null;
    } else {
      libraryLoadingEligible = false;
    }
  }
  const promise = runCompiled(repl.start, repl.end);
  observeRepl(promise, mode);
  return promise;
}

async function loadPreparedLibraries(plan, sources) {
  for (const library of plan) {
    await loadLibraryIntoRepl(library, sources.get(library.file));
  }
}

async function startAutomaticSession() {
  if (loaderBusy || replActive || manualExecutionBusy || keyResolver !== null || loaderPoisoned) return;

  const hasData = sessionHasData();
  if (hasData && !window.confirm(
    "Aquesta sessió ja conté memòria, definicions o entrada pendent. " +
    "Vols esborrar-la i començar de zero? Aquesta acció no es pot desfer.",
  )) {
    return;
  }

  const selected = selectedLibraryIds();
  let plan;
  try {
    plan = resolveLibraryPlan(selected);
  } catch (error) {
    setLoaderStatus(String(error));
    return;
  }

  loaderBusy = true;
  setLoaderStatus("Comprovant el bootstrap i les biblioteques seleccionades…");
  notifyLoaderState();
  let sources;
  try {
    const files = ["bootstrap.fth", ...plan.map(library => library.file)];
    sources = await fetchSources(files);
  } catch (error) {
    loaderBusy = false;
    setLoaderStatus(`No s'ha iniciat el sistema: ${String(error)}`);
    notifyLoaderState();
    return;
  }

  if (hasData) resetEngineState();
  automaticSession = true;
  loaderPoisoned = false;
  sessionTouched = false;
  let bootstrapStarted = true;
  try {
    const bootstrapLines = normalizeSourceLines(sources.get("bootstrap.fth"));
    for (let i = 0; i < bootstrapLines.length; i++) {
      setLoaderStatus(`Carregant bootstrap.fth, línia ${i + 1} de ${bootstrapLines.length}…`);
      try {
        await interpret(bootstrapLines[i]);
      } catch (error) {
        throw new Error(`bootstrap.fth, línia ${i + 1}: ${String(error)}`);
      }
    }
    if (compiling || waitingName || !words[wordMap.get("repl")]) {
      throw new Error("bootstrap.fth: la càrrega no ha creat un REPL complet.");
    }

    setLoaderStatus("Arrencant el REPL…");
    const replTask = launchRepl("automatic");
    await waitForReplTokenWait();
    if (mem[1005] !== 0 || mem[1012] !== 0 || mem[1016] !== 0) {
      throw new Error("El bootstrap ha deixat el compilador en un estat incomplet.");
    }
    libraryLoadingEligible = true;
    managedBaseline = { here: mem[1000], latest: mem[1004] };
    if (plan.length) await loadPreparedLibraries(plan, sources);
    setLoaderStatus(plan.length
      ? `REPL preparat. Biblioteques carregades: ${plan.map(library => library.file).join(", ")}.`
      : "REPL preparat. No s'ha seleccionat cap biblioteca.");
    void replTask;
  } catch (error) {
    loaderPoisoned = true;
    if (bootstrapStarted || replActive) {
      setLoaderStatus(`Càrrega parcial: ${String(error)}. No es repetirà automàticament; conserva el que necessitis abans de recarregar la pàgina.`);
    } else {
      setLoaderStatus(`No s'ha pogut completar l'arrencada: ${String(error)}`);
    }
  } finally {
    loaderBusy = false;
    notifyLoaderState();
  }
}

async function loadSelectedLibraries() {
  if (loaderBusy) return;
  if (!isLibraryLoadSafe()) {
    setLoaderStatus(loaderPoisoned
      ? "La càrrega anterior ha quedat parcial. Desa el que necessitis abans de recarregar la pàgina."
      : "No és segur carregar ara. Acaba l'ordre, el nom pendent o la definició oberta i espera que el REPL estigui disponible.");
    notifyLoaderState();
    return;
  }

  let plan;
  try {
    plan = resolveLibraryPlan(selectedLibraryIds(), loadedLibraries);
  } catch (error) {
    setLoaderStatus(String(error));
    return;
  }
  if (!plan.length) {
    setLoaderStatus("No hi ha cap biblioteca seleccionada.");
    return;
  }

  loaderBusy = true;
  setLoaderStatus("Comprovant les biblioteques seleccionades…");
  notifyLoaderState();
  let sources;
  try {
    sources = await fetchSources(plan.map(library => library.file));
  } catch (error) {
    loaderBusy = false;
    setLoaderStatus(`No s'ha carregat cap biblioteca: ${String(error)}`);
    notifyLoaderState();
    return;
  }

  try {
    await loadPreparedLibraries(plan, sources);
    setLoaderStatus(`Biblioteques carregades: ${plan.map(library => library.file).join(", ")}.`);
  } catch (error) {
    loaderPoisoned = true;
    setLoaderStatus(`Càrrega parcial: ${String(error)}. No es repetirà automàticament; pots continuar manualment o desar el que necessitis abans de recarregar.`);
  } finally {
    loaderBusy = false;
    notifyLoaderState();
  }
}

async function interpret(line) {
  let clean = line.replace(/\u00A0/g, " ");
  clean = clean.replace(/\(\s[^\)]*\)/g, " ");
  let idx = clean.indexOf("\\");
  if (idx >= 0) clean = clean.substring(0, idx);
  clean = clean.trim();
  if (clean === "") return;

  let tokens = clean.split(/\s+/);
  for (let i = 0; i < tokens.length; i++) {
    let tok = tokens[i];

    if (waitingName) {
      currentWord = { name: tok, start: codeOp.length, end: 0 };
      waitingName = false;
      continue;
    }

    if (!compiling) {
      if (tok === ":") {
        compiling = true;
        waitingName = true;
        continue;
      }
      if (tok === ";") {
        throw "; outside definition";
      }
      let inst = compileToken(tok);
      if (inst.op === OP_BRANCH || inst.op === OP_QBRANCH) {
        throw tok + " outside definition";
      }
      if (tok === "repl" && inst.op === OP_CALL && words[inst.val]?.name === "repl") {
        const mode = automaticSession && !sessionTouched ? "automatic" : "manual";
        await launchRepl(mode);
        continue;
      }
      let tmpStart = codeOp.length;
      codeOp.push(inst.op);
      codeVal.push(inst.val);
      try {
        await runCompiled(tmpStart, tmpStart + 1);
      } finally {
        codeOp.length = tmpStart;
        codeVal.length = tmpStart;
      }
      continue;
    }

    if (tok === ";") {
      currentWord.end = codeOp.length;
      let newIdx = words.length;
      words.push(currentWord);
      wordMap.set(currentWord.name, newIdx);
      compiling = false;
      currentWord = null;
      continue;
    }

    if (tok === ":") {
      throw "nested : not allowed";
    }

    let inst = compileToken(tok);
    codeOp.push(inst.op);
    codeVal.push(inst.val);
  }
  flushOut();
}

async function executar() {
  let line = inp.value;
  if (loaderBusy) return;

  if (replActive) {
    if (line.length > 0) sessionTouched = true;
    for (let i = 0; i < line.length; i++) keyBuffer.push(line.charCodeAt(i));
    keyBuffer.push(13);
    inp.value = "";
    releaseKeyWait();
    notifyLoaderState();
    return;
  }

  if (keyResolver) {
    for (let i = 0; i < line.length; i++) keyBuffer.push(line.charCodeAt(i));
    keyBuffer.push(13);
    inp.value = "";
    releaseKeyWait();
    return;
  }
  if (manualExecutionBusy) {
    setLoaderStatus("El motor encara està executant l'ordre anterior. Espera que acabi abans d'enviar-ne una altra.");
    return;
  }

  if (automaticSession && line.trim() && line.trim() !== "repl") {
    sessionTouched = true;
  }
  inp.value = "";
  out(line + "\n");
  manualExecutionBusy = true;
  notifyLoaderState();
  try {
    await interpret(line);
  } catch (e) {
    if (currentWord) {
      codeOp.length = currentWord.start;
      codeVal.length = currentWord.start;
    }
    compiling = false;
    waitingName = false;
    currentWord = null;
    out("ERROR: " + e + "\n");
  } finally {
    manualExecutionBusy = false;
  }
  flushOut();
  inp.value = "";
  updateStack();
  updateWordsList();
  if (!keyResolver) prompt();
  inp.focus();
  notifyLoaderState();
}

btn.onclick = executar;
inp.oninput = function() {
  if (keyResolver && inp.value.length > 0) {
    if (replActive && !loaderBusy) sessionTouched = true;
    releaseKeyWait();
  }
};
inp.onkeydown = function(e) {
  if (e.key === "Enter" || e.keyCode === 13) {
    e.preventDefault();
    executar();
  }
};

function syncLibrarySelection() {
  const checkboxes = [...libraryInputs.values()];
  selectAllLibraries.checked = checkboxes.length > 0 && checkboxes.every(input => input.checked);
  selectAllLibraries.indeterminate = checkboxes.some(input => input.checked) && !selectAllLibraries.checked;
  updateLibrarySummary();
  updateLoaderControls();
}

for (const input of libraryInputs.values()) {
  input.addEventListener?.("change", syncLibrarySelection);
  if (!input.addEventListener) input.onchange = syncLibrarySelection;
}
selectAllLibraries.addEventListener?.("change", () => {
  for (const input of libraryInputs.values()) input.checked = selectAllLibraries.checked;
  syncLibrarySelection();
});
if (!selectAllLibraries.addEventListener) {
  selectAllLibraries.onchange = () => {
    for (const input of libraryInputs.values()) input.checked = selectAllLibraries.checked;
    syncLibrarySelection();
  };
}
bootBtn.onclick = startAutomaticSession;
loadLibrariesBtn.onclick = loadSelectedLibraries;

updateLibrarySummary();
updateLoaderControls();
out("MiniForth\n\n");
prompt();
</script>
